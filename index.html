<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        
        <!-- Mode Selection Screen -->
        <div id="modeScreen" class="mode-selection active-screen">
            <h2>Select Game Mode</h2>
            <button class="mode-btn" id="twoPlayerBtn">Two Player</button>
            <button class="mode-btn" id="onePlayerBtn">One Player</button>
        </div>
        
        <!-- Difficulty Selection Screen (shown when one player mode is selected) -->
        <div id="difficultyScreen" class="difficulty-selection game-screen">
            <h2>Select Difficulty</h2>
            <button class="difficulty-btn" id="easyBtn">Easy</button>
            <button class="difficulty-btn" id="mediumBtn">Medium</button>
            <button class="difficulty-btn" id="hardBtn">Hard</button>
        </div>
        
        <!-- Game Screen -->
        <div id="gameScreen" class="game-screen">
            <div class="status" id="status">Player X's turn</div>
            <div class="board-container">
                <div class="board" id="board">
                    <div class="cell" data-cell-index="0"></div>
                    <div class="cell" data-cell-index="1"></div>
                    <div class="cell" data-cell-index="2"></div>
                    <div class="cell" data-cell-index="3"></div>
                    <div class="cell" data-cell-index="4"></div>
                    <div class="cell" data-cell-index="5"></div>
                    <div class="cell" data-cell-index="6"></div>
                    <div class="cell" data-cell-index="7"></div>
                    <div class="cell" data-cell-index="8"></div>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn">Reset Game</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
